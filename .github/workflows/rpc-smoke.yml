name: Public RPC smoke

on:
  workflow_dispatch:
    inputs:
      protocol:
        description: Transport subpath to check, or all
        default: all
        required: true
        type: string

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.18.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify identity and head
        env:
          RPC_PROTOCOL: ${{ inputs.protocol }}
        run: |
          if [ "$RPC_PROTOCOL" = all ]; then
            node scripts/check-rpcs.mjs > rpc-smoke.json
          else
            node scripts/check-rpcs.mjs --protocol "$RPC_PROTOCOL" > rpc-smoke.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rpc-smoke
          path: rpc-smoke.json
